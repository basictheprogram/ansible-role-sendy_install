---
argument_specs:
  main:
    short_description: >-
      First-time install of Sendy on Debian/Ubuntu, against a
      pre-provisioned web server, PHP, and database server.
    description: >-
      Extracts a purchased Sendy release zip staged on the Ansible
      control node, writes includes/config.php, sets ownership and
      permissions, creates the Sendy database/user/grants, and wires up
      the send-queue cron job. Does not install the web server, PHP, or
      the MySQL/MariaDB server itself, and does not import Sendy's
      schema (tables) — those must already exist. This role installs
      only; use the sibling realtime.sendy role to upgrade an existing
      install.
    options:
      sendy_install_packages:
        type: list
        elements: str
        default: [unzip, rsync, cron, python3-pymysql]
        description: >-
          Packages this role installs directly because its own tasks
          depend on them (unzip for ansible.builtin.unarchive, rsync for
          ansible.posix.synchronize, cron for ansible.builtin.cron's
          crontab binary, python3-pymysql for ansible.mysql.mysql_db
          and mysql_user) -- not general OS package management.
      sendy_install_dir:
        type: str
        default: /var/www/html/sendy
        description: Absolute path to the Sendy web root on the remote host.
      sendy_install_staging_dir:
        type: str
        default: /tmp/sendy_install
        description: >-
          Temp directory on the remote host used to extract the build
          before it is synced into sendy_install_dir. Wiped at the start
          and end of every run.
      sendy_install_web_user:
        type: str
        default: www-data
        description: System user that owns installed files and runs PHP.
      sendy_install_web_group:
        type: str
        default: www-data
        description: System group that owns installed files.
      sendy_install_dir_mode:
        type: str
        default: "0755"
        description: >-
          Permission mode applied to directories this role creates
          directly (staging dir, install dir's parent). The extracted
          Sendy tree keeps the symbolic mode applied during extraction
          instead, which differentiates files from directories.
      sendy_install_writable_dirs:
        type: list
        elements: str
        default: [uploads]
        description: >-
          Subdirectories (relative to sendy_install_dir) that Sendy
          writes to at runtime and need group-writable permissions.
      sendy_install_writable_dir_mode:
        type: str
        default: "0775"
        description: Permission mode applied to sendy_install_writable_dirs.
      sendy_install_zip_src:
        type: str
        default: ""
        description: >-
          Required. Full path to the purchased Sendy zip on the Ansible
          control node. Enforced non-empty by preflight, not by this
          argument spec, so the friendlier preflight error message fires.
          Preflight also parses a semantic version (X.Y.Z) from this
          file's basename (e.g. sendy-7.0.6.zip) and fails if it isn't
          newer than sendy_install_version_marker's recorded version.
      sendy_install_version_marker:
        type: str
        default: /var/lib/sendy_install/version
        description: >-
          Path on the target host where this role records the Sendy
          version it last installed, parsed from sendy_install_zip_src's
          filename. Preflight fails if a new zip's version is the same
          as or older than what's recorded here.
      sendy_install_force_reinstall:
        type: bool
        default: false
        description: >-
          Testing escape hatch. Bypasses only the same-or-older-version
          guard against sendy_install_version_marker -- does not bypass
          the separate guard that fails if Sendy is already installed at
          sendy_install_dir. Leave false in production.
      sendy_install_url:
        type: str
        default: ""
        description: >-
          Required. Full public URL Sendy will be served from, without a
          trailing slash, written into config.php's APP_PATH. Enforced
          non-empty by preflight.
      sendy_install_cookie_domain:
        type: str
        default: ""
        description: >-
          Domain written into config.php's COOKIE_DOMAIN. Left empty by
          default per Sendy's own documentation.
      sendy_install_db_host:
        type: str
        default: 127.0.0.1
        description: >-
          Hostname of the Sendy database, written into config.php's
          $dbHost. See sendy_install_db_grant_host for the separate
          host pattern the created database user is granted access
          from.
      sendy_install_db_grant_host:
        type: str
        default: "{{ sendy_install_db_host }}"
        description: >-
          Host pattern ('user'@'<this>') the created Sendy database
          user is granted access from. Defaults to sendy_install_db_host
          for backward compatibility; override separately when the
          database is reached at a different address than the
          connecting client's apparent source address -- e.g. a
          containerized database behind a published port, where the
          real client source is often not sendy_install_db_host itself.
      sendy_install_db_port:
        type: int
        default: 3306
        description: Port of the Sendy database.
      sendy_install_db_name:
        type: str
        default: sendy
        description: Name of the Sendy database this role creates.
      sendy_install_db_username:
        type: str
        default: sendy
        description: Username of the Sendy database user this role creates.
      sendy_install_db_password:
        type: str
        default: ""
        description: >-
          Required. Password this role sets for the Sendy database user
          it creates. Enforced non-empty by preflight. Never logged.
      sendy_install_db_charset:
        type: str
        default: utf8mb4
        description: >-
          MySQL character set config.php connects with, and that the
          created database uses.
      sendy_install_db_auth_plugin:
        type: str
        default: caching_sha2_password
        description: >-
          Authentication plugin assigned to the created Sendy database
          user, applied via plugin_auth_string rather than password
          (see tasks/database.yml). Set explicitly rather than left to
          the server's default, since some servers still resolve to the
          deprecated mysql_native_password plugin, which MySQL 8.4+
          disables by default and fails CREATE USER with error 1524.
      sendy_install_db_admin_user:
        type: str
        default: ""
        description: >-
          Required. Privileged account this role authenticates as, over
          TCP to sendy_install_db_host:sendy_install_db_port, to create
          the Sendy database, user, and grants -- e.g. an RDS instance's
          master user. Enforced non-empty by preflight.
      sendy_install_db_admin_password:
        type: str
        default: ""
        description: >-
          Required. Password for sendy_install_db_admin_user. Enforced
          non-empty by preflight. Never logged.
      sendy_install_manage_cron:
        type: bool
        default: true
        description: Whether this role manages Sendy's cron jobs at all.
      sendy_install_cron_user:
        type: str
        default: "{{ sendy_install_web_user }}"
        description: System user the cron jobs run as.
      sendy_install_cron_jobs:
        type: list
        elements: dict
        default:
          - name: "sendy_install: process send queue"
            minute: "*/1"
            job: "php {{ sendy_install_dir }}/cron/campaigns.php > /dev/null 2>&1"
        description: >-
          Cron job entries passed directly to ansible.builtin.cron. The
          default covers Sendy's documented send-queue processor only —
          add entries here for any additional cron scripts your Sendy
          version's documentation lists.
