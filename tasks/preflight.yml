---
# tasks/preflight.yml
# Validate all preconditions before touching the target host.
# Fail fast — before any files are extracted or written.

- name: "Preflight | Assert supported ansible-core version"
  ansible.builtin.assert:
    that:
      - ansible_version.full is version("2.20", ">=")
    fail_msg: >
      sendy_install requires ansible-core >= 2.20
      (running {{ ansible_version.full }}).
    quiet: true

- name: "Preflight | Assert supported OS family"
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    fail_msg: >
      sendy_install only supports Debian and Ubuntu
      (target reports {{ ansible_facts['distribution'] }}).
    quiet: true

- name: "Preflight | Warn on OS release outside the tested support matrix"
  ansible.builtin.debug:
    msg: >
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_release'] }}
      is not one of this role's tested releases
      (Debian bookworm/trixie, Ubuntu jammy/noble/resolute). Proceeding anyway —
      this is a warning, not a failure.
  when: ansible_facts['distribution_release'] not in ['bookworm', 'trixie', 'jammy', 'noble', 'resolute']

- name: "Preflight | Assert required variables are set"
  ansible.builtin.assert:
    that:
      - sendy_install_zip_src | length > 0
      - sendy_install_url | length > 0
      - sendy_install_db_password | length > 0
    fail_msg: >
      One or more required variables are empty. Set sendy_install_zip_src,
      sendy_install_url, and sendy_install_db_password in host_vars
      before running this role.
    quiet: true

- name: "Preflight | Check that the Sendy zip exists on the control node"
  ansible.builtin.stat:
    path: "{{ sendy_install_zip_src }}"
  register: _sendy_install_zip_stat
  delegate_to: localhost
  become: false

- name: "Preflight | Fail if zip is not present on control node"
  ansible.builtin.fail:
    msg: >
      Sendy zip not found at {{ sendy_install_zip_src }} on the Ansible
      control node. Stage the purchased Sendy zip at this path and set
      sendy_install_zip_src accordingly.
  when: not _sendy_install_zip_stat.stat.exists

- name: "Preflight | Parse Sendy version from the zip filename"
  ansible.builtin.set_fact:
    _sendy_install_zip_version: "{{ sendy_install_zip_src | basename | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)') }}"

- name: "Preflight | Fail if no semantic version could be parsed from the zip filename"
  ansible.builtin.fail:
    msg: >
      Could not parse a semantic version (X.Y.Z) from the filename
      {{ sendy_install_zip_src | basename }}. Sendy releases are named
      like sendy-7.0.6.zip — rename the file to match that pattern, or
      verify sendy_install_zip_src points at a genuine Sendy release zip.
  when: not _sendy_install_zip_version

- name: "Preflight | Check for a version marker from a previous install"
  ansible.builtin.stat:
    path: "{{ sendy_install_version_marker }}"
  register: _sendy_install_version_marker_stat

- name: "Preflight | Read the previous install's recorded version"
  ansible.builtin.slurp:
    src: "{{ sendy_install_version_marker }}"
  register: _sendy_install_version_marker_slurp
  when: _sendy_install_version_marker_stat.stat.exists

- name: "Preflight | Fail if the zip is the same version or older than the last install"
  ansible.builtin.fail:
    msg: >
      {{ sendy_install_zip_src | basename }} is version
      {{ _sendy_install_zip_version }}, which is not newer than
      {{ _sendy_install_version_marker_slurp.content | b64decode | trim }}
      already recorded at {{ sendy_install_version_marker }}. Refusing to
      install the same or an older version over a newer one. Set
      sendy_install_force_reinstall: true to bypass this for testing.
  when:
    - not sendy_install_force_reinstall
    - _sendy_install_version_marker_stat.stat.exists
    - _sendy_install_zip_version is version(_sendy_install_version_marker_slurp.content | b64decode | trim, '<=')

- name: "Preflight | Check whether Sendy is already installed"
  ansible.builtin.stat:
    path: "{{ sendy_install_dir }}/includes/config.php"
  register: _sendy_install_config_stat

- name: "Preflight | Fail if Sendy is already installed at the target directory"
  ansible.builtin.fail:
    msg: >
      {{ sendy_install_dir }}/includes/config.php already exists — Sendy
      appears to already be installed here. This role performs a first-time
      install only; use the realtime.sendy role to upgrade an existing
      install instead.
  when: _sendy_install_config_stat.stat.exists

- name: "Preflight | Display install target info"
  ansible.builtin.debug:
    msg:
      - "Host        : {{ inventory_hostname }}"
      - "Install dir : {{ sendy_install_dir }}"
      - "Zip source  : {{ sendy_install_zip_src }}"
      - "Staging dir : {{ sendy_install_staging_dir }}"
      - "Install URL : {{ sendy_install_url }}"
      - "Manage cron : {{ sendy_install_manage_cron }}"
