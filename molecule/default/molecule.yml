---
# molecule/default/molecule.yml
# Default scenario: happy-path first-time install across the full OS matrix.
#
# Images: geerlingguy's systemd-enabled Ansible images (Docker Hub).
# Verify current tags at https://hub.docker.com/u/geerlingguy
# or https://github.com/geerlingguy?tab=packages&q=ansible
# Update image names here when new platform images are published.

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: debian-12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

  - name: debian-13
    image: geerlingguy/docker-debian13-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

  - name: ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

  - name: ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

  - name: ubuntu-2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      # molecule-docker's destroy.yml uses 'when: (lookup('env', 'HOME'))' which
      # returns a string rather than a boolean. ansible-core 2.20 rejects this.
      # Remove once molecule-docker ships a fix.
      allow_broken_conditionals: true
  playbooks:
    converge: converge.yml
  inventory:
    host_vars:
      debian-12:
        ansible_python_interpreter: /usr/bin/python3
      ubuntu-2204:
        ansible_python_interpreter: /usr/bin/python3
      ubuntu-2404:
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: testinfra
  directory: tests/
  options:
    v: true
    p: "no:cacheprovider"

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
